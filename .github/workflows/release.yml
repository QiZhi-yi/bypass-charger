name: Build Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read module version
        id: meta
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "模块版本: $VERSION"

      - name: Build zip
        run: python3 build_zip.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ steps.meta.outputs.version }}
          path: '*.zip'

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true

      # 同步 update.json 到 main，让各 Root 管理器能检测到新版本
      - name: Update update.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json
          import os
          repo = os.environ['GITHUB_REPOSITORY']
          props = {}
          for line in open('module.prop', encoding='utf-8'):
              line = line.strip()
              if '=' in line and not line.startswith('#'):
                  k, v = line.split('=', 1)
                  props[k] = v
          ver = props['version']
          data = {
              "version": ver,
              "versionCode": int(props['versionCode']),
              "zipUrl": f"https://github.com/{repo}/releases/download/{ver}/bypass-charger-{ver}.zip",
              "changelog": f"https://raw.githubusercontent.com/{repo}/main/CHANGELOG.md",
          }
          with open('update.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print("update.json 已生成:", ver, props['versionCode'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json 无变化，跳过提交"
          else
            git commit -m "chore: 同步 update.json"
            git push origin HEAD:main
          fi
