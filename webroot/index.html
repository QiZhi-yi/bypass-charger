<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>自动旁路供电</title>
<style>
  :root{
    --bg:#0e1014; --card:#171a21; --card2:#1e222b; --line:#272c36;
    --tx:#e9ecf1; --tx2:#8d95a3; --acc:#3ddc97; --acc2:#2dbd80;
    --warn:#f5b942; --red:#f0716c; --blue:#5aa9f0;
    --r:.9rem;
  }
  /* 基准字号随屏幕宽度自适应，所有尺寸用 rem，整体等比缩放 */
  html{font-size:clamp(14px, 4.3vw, 18px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  body{padding:1rem .9rem calc(1.8rem + env(safe-area-inset-bottom))}
  .wrap{width:min(100%, 40rem);margin:0 auto}

  header{display:flex;align-items:center;gap:.6rem;margin:.25rem .1rem 1rem}
  .h-title{font-size:1.15rem;font-weight:650;letter-spacing:.2px}
  .h-sub{font-size:.75rem;color:var(--tx2);margin-top:1px}
  .badges{margin-left:auto;display:flex;gap:.4rem;align-items:center}
  .badge{font-size:.72rem;font-weight:600;padding:.3rem .65rem;border-radius:999px;
    background:var(--card2);color:var(--tx2);border:1px solid var(--line);white-space:nowrap}
  .badge.on{background:rgba(61,220,151,.14);color:var(--acc);border-color:rgba(61,220,151,.35)}
  .badge.off{background:rgba(141,149,163,.12);color:var(--tx2)}
  .badge.err{background:rgba(240,113,108,.14);color:var(--red);border-color:rgba(240,113,108,.3)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:1rem;margin-bottom:.75rem}
  .card-t{font-size:.75rem;font-weight:600;color:var(--tx2);letter-spacing:.4px;margin-bottom:.8rem}
  .divider{height:1px;background:var(--line);margin:1rem 0}

  /* 主状态卡 */
  .hero{display:flex;align-items:center;gap:1.1rem;padding:1.1rem 1rem}
  .ring{position:relative;width:clamp(5.6rem, 24vw, 7.4rem);height:clamp(5.6rem, 24vw, 7.4rem);flex:0 0 auto}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
  .ring .arc{fill:none;stroke:var(--line);stroke-width:9}
  .ring .bar{fill:none;stroke:var(--acc);stroke-width:9;stroke-linecap:round;
    transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1),stroke .3s}
  .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center}
  .ring .pct{font-size:clamp(1.5rem, 6.5vw, 2.1rem);font-weight:700;letter-spacing:-.5px;line-height:1}
  .ring .pct small{font-size:.72rem;font-weight:600;color:var(--tx2);margin-left:1px}
  .ring .cap{font-size:.62rem;color:var(--tx2);margin-top:.2rem;letter-spacing:.5px}

  .hero-r{flex:1;min-width:0}
  .state{font-size:1.05rem;font-weight:650;margin-bottom:2px}
  .state-d{font-size:.78rem;color:var(--tx2);margin-bottom:.7rem}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .m{background:var(--card2);border-radius:.6rem;padding:.5rem .6rem;min-width:0}
  .m-k{font-size:.66rem;color:var(--tx2);letter-spacing:.3px}
  .m-v{font-size:.88rem;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums;word-break:break-all}

  /* 开关行 */
  .row{display:flex;align-items:center;gap:.75rem}
  .row-t{font-size:.95rem;font-weight:550}
  .row-d{font-size:.74rem;color:var(--tx2);margin-top:1px}
  .switch{margin-left:auto;position:relative;width:3rem;height:1.75rem;flex:0 0 auto}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:#333945;border-radius:999px;
    transition:.25s;cursor:pointer}
  .switch span::after{content:"";position:absolute;width:1.4rem;height:1.4rem;left:.18rem;top:.18rem;
    background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .switch input:checked + span{background:var(--acc2)}
  .switch input:checked + span::after{transform:translateX(1.25rem)}
  .switch input:disabled + span{opacity:.45}

  /* 滑块 */
  .sl{margin-bottom:1rem}
  .sl:last-of-type{margin-bottom:.4rem}
  .sl-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.45rem}
  .sl-l{font-size:.84rem;color:var(--tx)}
  .sl-v{font-size:.9rem;font-weight:650;color:var(--acc);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;width:100%;height:.3rem;border-radius:.2rem;
    background:#2b3140;outline:none;margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.3rem;height:1.3rem;
    border-radius:50%;background:#fff;border:3px solid var(--acc2);cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .hint{font-size:.7rem;color:var(--tx2);margin-top:.55rem;line-height:1.5}

  /* 时间选择器（自绘步进器，样式统一、无原生弹窗）*/
  .time-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.9rem}
  .time-l{display:block;font-size:.72rem;color:var(--tx2);margin-bottom:.3rem}
  .time-sel{display:flex;align-items:center;gap:.3rem}
  .time-colon{color:var(--tx2);font-weight:600;font-size:1.1rem;flex:0 0 auto}
  .step{display:flex;flex-direction:column;align-items:center;gap:.2rem;flex:1}
  .step-val{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;
    background:var(--card2);border:1px solid var(--line);border-radius:.5rem;
    padding:.3rem 0;width:100%;text-align:center;line-height:1.2}
  .step-btn{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:.4rem;
    color:var(--tx2);font-size:.72rem;line-height:1;padding:.32rem 0;cursor:pointer;
    font-family:inherit;transition:.15s;touch-action:manipulation;
    -webkit-user-select:none;user-select:none}
  .step-btn:active{background:#2b3140;color:var(--tx)}
  .time-sel.off{opacity:.45;pointer-events:none}

  button{width:100%;padding:.75rem;border-radius:.65rem;border:none;font-size:.9rem;
    font-weight:600;font-family:inherit;cursor:pointer;transition:.18s;
    background:var(--acc2);color:#07130d;margin-top:.6rem}
  button:active{transform:scale(.985);opacity:.88}
  button:disabled{opacity:.4;transform:none}
  .btn-ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}

  /* 日志（可折叠） */
  .log-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
  .log-head .card-t{margin-bottom:0}
  .log-arrow{color:var(--tx2);font-size:.8rem;transition:.2s}
  pre.log{margin:.8rem 0 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.68rem;
    line-height:1.65;color:#9aa4b2;max-height:12rem;overflow-y:auto;
    background:#0b0d11;border-radius:.6rem;padding:.7rem;white-space:pre-wrap;
    word-break:break-all;border:1px solid #1d222b}

  .foot{text-align:center;font-size:.68rem;color:#5c6473;margin-top:1.1rem;line-height:1.7}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.64rem;color:#5c6473;
    word-break:break-all}
  .errbox{background:rgba(240,113,108,.1);border:1px solid rgba(240,113,108,.25);
    color:var(--red);border-radius:.75rem;padding:.75rem;font-size:.8rem;margin-bottom:.75rem;
    display:none}
  .opmsg{position:fixed;top:1rem;left:0;right:0;margin:0 auto;z-index:999;
    display:none;width:max-content;max-width:80%;
    border-radius:.8rem;padding:.75rem 1.2rem;
    font-size:.82rem;line-height:1.5;text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .opmsg.ok{display:block;background:#12351f;border:1px solid rgba(61,220,151,.45);color:#7fe6b4}
  .opmsg.bad{display:block;background:#3a1715;border:1px solid rgba(240,113,108,.45);color:#f5a9a5}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="h-title">自动旁路供电</div>
      <div class="h-sub">v<span id="verTx">--</span></div>
    </div>
    <div class="badges">
      <div class="badge" id="modeBadge" style="display:none;background:rgba(96,165,250,.14);color:#7fb6ff;border-color:rgba(96,165,250,.35)"></div>
      <div class="badge off" id="badge">读取中</div>
    </div>
  </header>

  <div class="errbox" id="errbox"></div>
  <div class="opmsg" id="opMsg"></div>

  <section class="card hero">
    <div class="ring">
      <svg viewBox="0 0 118 118">
        <circle class="arc" cx="59" cy="59" r="51"></circle>
        <circle class="bar" id="bar" cx="59" cy="59" r="51"
                stroke-dasharray="320.4" stroke-dashoffset="320.4"></circle>
      </svg>
      <div class="in">
        <div class="pct"><span id="pct">--</span><small>%</small></div>
        <div class="cap" id="ringcap">电量</div>
      </div>
    </div>
    <div class="hero-r">
      <div class="state" id="stateTx">—</div>
      <div class="state-d" id="stateSub">正在读取状态…</div>
      <div class="metrics">
        <div class="m"><div class="m-k">电池电流</div><div class="m-v" id="mI">—</div></div>
        <div class="m"><div class="m-k">温度</div><div class="m-v" id="mT">—</div></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <div>
        <div class="row-t">启用旁路供电</div>
        <div class="row-d">到达阈值后停止充电，改由适配器供电</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="swEnable">
        <span></span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="card-t">充电阈值</div>
    <div class="sl">
      <div class="sl-h">
        <span class="sl-l">停止充电</span>
        <span class="sl-v" id="v1">80%</span>
      </div>
      <input type="range" id="t1" min="1" max="100" step="1" value="80">
    </div>
    <div class="sl">
      <div class="sl-h">
        <span class="sl-l">恢复充电</span>
        <span class="sl-v" id="v2">75%</span>
      </div>
      <input type="range" id="t2" min="1" max="99" step="1" value="75">
    </div>
    <div class="hint" id="hint">恢复阈值需低于停止阈值，至少相差 5%；否则会在同一电量反复开关。</div>
    <button id="btnSave">保存阈值</button>
  </section>

  <section class="card">
    <div class="row">
      <div>
        <div class="row-t">定时旁路</div>
        <div class="row-d">仅在指定时间段内启用旁路，其余时间正常充电</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="swSched">
        <span></span>
      </label>
    </div>
    <div class="time-row">
      <div>
        <label class="time-l">开始时间</label>
        <div class="time-sel" id="schedStartBox">
          <div class="step">
            <button class="step-btn" data-k="startH" data-d="1">▲</button>
            <div class="step-val" id="schedStartH">23</div>
            <button class="step-btn" data-k="startH" data-d="-1">▼</button>
          </div>
          <span class="time-colon">:</span>
          <div class="step">
            <button class="step-btn" data-k="startM" data-d="1">▲</button>
            <div class="step-val" id="schedStartM">00</div>
            <button class="step-btn" data-k="startM" data-d="-1">▼</button>
          </div>
        </div>
      </div>
      <div>
        <label class="time-l">结束时间</label>
        <div class="time-sel" id="schedEndBox">
          <div class="step">
            <button class="step-btn" data-k="endH" data-d="1">▲</button>
            <div class="step-val" id="schedEndH">07</div>
            <button class="step-btn" data-k="endH" data-d="-1">▼</button>
          </div>
          <span class="time-colon">:</span>
          <div class="step">
            <button class="step-btn" data-k="endM" data-d="1">▲</button>
            <div class="step-val" id="schedEndM">00</div>
            <button class="step-btn" data-k="endM" data-d="-1">▼</button>
          </div>
        </div>
      </div>
    </div>
    <div class="hint" id="schedHint">定时关闭，全天启用旁路</div>
    <div class="hint" style="margin-top:2px;color:#5c6473">长按按钮可以更快设置时间</div>
    <button id="btnSchedSave">保存定时</button>
  </section>

  <section class="card">
    <div class="card-t">巡检间隔</div>
    <div class="sl">
      <div class="sl-h">
        <span class="sl-l">每次检查的间隔</span>
        <span class="sl-v" id="v3">15 秒</span>
      </div>
      <input type="range" id="t3" min="5" max="120" step="5" value="15">
    </div>
    <div class="hint">间隔越短响应越快，但唤醒更频繁、略耗电。建议 10–30 秒。</div>
  </section>

  <section class="card">
    <div class="log-head" id="logHead">
      <div class="card-t">运行日志</div>
      <span class="log-arrow" id="logArrow">▸</span>
    </div>
    <pre class="log" id="log" hidden>加载中…</pre>
  </section>

  <section class="card" id="daemonCard" style="display:none">
    <div class="row">
      <div>
        <div class="row-t">守护进程未运行</div>
        <div class="row-d">自动控制需要守护进程常驻</div>
      </div>
      <button class="btn-ghost" id="btnStart" style="width:auto;padding:.6rem 1.1rem;margin-left:auto">启动</button>
    </div>
  </section>

  <div class="foot">
    <div class="mono" id="nodePath">—</div>
    <div style="margin-top:.4rem" id="daemonLine">—</div>
    <div style="margin-top:.25rem" id="bridgeInfo">桥接检测中…</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var SH = "/data/adb/modules/bypass_charger/webui.sh";
  var CIRC = 320.4;              // 2πr, r=51
  var state = null;
  var busy = false;
  var timer = null;

  var el = function(id){ return document.getElementById(id); };

  /* ---------------- KSU 桥接 ---------------- */
  var BRIDGE_MODE = null;
  var BRIDGE_TRIED = [];
  var cbSeq = 0;

  function hasKsu(){
    return typeof ksu !== "undefined" && ksu && typeof ksu.exec === "function";
  }

  function normResult(a, b, c){
    if (a && typeof a === "object") {
      return {
        errno: Number(a.errno || a.code || 0),
        stdout: String(a.stdout == null ? "" : a.stdout),
        stderr: String(a.stderr == null ? "" : a.stderr)
      };
    }
    if (typeof a === "string") {
      var s = a.replace(/^\s+/, "");
      if (s.charAt(0) === "{") {
        try {
          var o = JSON.parse(s);
          if (o && typeof o === "object") {
            return {
              errno: Number(o.errno || 0),
              stdout: String(o.stdout == null ? "" : o.stdout),
              stderr: String(o.stderr == null ? "" : o.stderr)
            };
          }
        } catch (e) {}
      }
      return { errno: 0, stdout: a, stderr: String(b == null ? "" : b) };
    }
    return {
      errno: Number(a || 0),
      stdout: String(b == null ? "" : b),
      stderr: String(c == null ? "" : c)
    };
  }

  function execMode(cmd, mode, timeoutMs){
    return new Promise(function(resolve, reject){
      var settled = false;
      var cbName = null;
      function cleanup(){
        if (cbName && window[cbName]) { try { delete window[cbName]; } catch(e){} }
      }
      var timer = setTimeout(function(){
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error("回调超时"));
      }, timeoutMs || 2500);

      function fin(a, b, c){
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        cleanup();
        resolve(normResult(a, b, c));
      }

      try {
        if (mode === 1) {
          var r = ksu.exec(cmd);
          if (r === undefined || r === null) throw new Error("无返回值");
          fin(0, String(r), "");
        } else if (mode === 2) {
          cbName = "__ksuCb" + (++cbSeq);
          window[cbName] = fin;
          ksu.exec(cmd, "{}", cbName);
        } else {
          cbName = "__ksuCb" + (++cbSeq);
          window[cbName] = fin;
          ksu.exec(cmd, cbName);
        }
      } catch (e) {
        if (!settled) {
          settled = true;
          clearTimeout(timer);
          cleanup();
          reject(e);
        }
      }
    });
  }

  function probeBridge(){
    if (!hasKsu()) return Promise.reject(new Error("未检测到 ksu 对象"));
    BRIDGE_TRIED = [];
    var modes = [1, 2, 3];
    var i = 0;
    function next(){
      if (i >= modes.length) {
        return Promise.reject(new Error("三种调用方式都不通 — " + BRIDGE_TRIED.join(" ; ")));
      }
      var m = modes[i++];
      return execMode("echo __KSU_OK__", m, 2000).then(function(r){
        if (r.errno === 0 && r.stdout.indexOf("__KSU_OK__") > -1) {
          BRIDGE_MODE = m;
          paintBridge();
          return m;
        }
        BRIDGE_TRIED.push("方式" + m + " 无输出");
        return next();
      }).catch(function(e){
        BRIDGE_TRIED.push("方式" + m + " " + ((e && e.message) || e));
        return next();
      });
    }
    return next();
  }

  function paintBridge(){
    var n = el("bridgeInfo");
    if (n) n.textContent = BRIDGE_MODE ? ("桥接方式 " + BRIDGE_MODE) : "桥接未就绪";
  }

  function run(cmd){
    if (!hasKsu()) {
      return Promise.reject(new Error("未检测到 KernelSU 接口，请在 KSU 管理器中打开本页"));
    }
    var start = BRIDGE_MODE ? Promise.resolve(BRIDGE_MODE) : probeBridge();
    return start.then(function(mode){
      return execMode(cmd, mode, 8000).then(function(r){
        if (r.errno !== 0) {
          throw new Error((r.stderr || "").replace(/\s+$/, "") || ("退出码 " + r.errno));
        }
        return r.stdout;
      });
    }).catch(function(e){
      BRIDGE_MODE = null;
      throw e;
    });
  }

  function toast(msg){
    if (typeof ksu !== "undefined" && ksu && typeof ksu.toast === "function") {
      try { ksu.toast(msg); return; } catch(e){}
    }
    var b = el("errbox");
    b.textContent = msg; b.style.display = "block";
    setTimeout(function(){ b.style.display = "none"; }, 2600);
  }

  function parseKV(txt){
    var o = {};
    String(txt || "").split(/[\n;]/).forEach(function(line){
      var i = line.indexOf("=");
      if (i > 0) o[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    });
    return o;
  }

  /* ---------------- 渲染 ---------------- */
  var lastMode = "";
  var lastVer = "";
  var dirty = { t1:false, t2:false, t3:false, sched:false };

  // 定时时间状态（自绘步进器）
  var sched = { startH: 23, startM: 0, endH: 7, endM: 0 };
  var schedMax = { startH: 23, startM: 59, endH: 23, endM: 59 };

  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function renderSched(){
    el("schedStartH").textContent = pad2(sched.startH);
    el("schedStartM").textContent = pad2(sched.startM);
    el("schedEndH").textContent = pad2(sched.endH);
    el("schedEndM").textContent = pad2(sched.endM);
  }
  function parseHHMM(hhmm){
    var p = String(hhmm || "00:00").split(":");
    return { h: parseInt(p[0], 10) || 0, m: parseInt(p[1], 10) || 0 };
  }
  function stepTime(key, delta){
    var max = schedMax[key];
    var v = sched[key] + delta;
    if (v < 0) v = max; else if (v > max) v = 0;
    sched[key] = v;
    dirty.sched = true;
    renderSched();
  }
  // 步进按钮：单击 ±1，长按连续增减
  (function(){
    var holdDelay = null, holdTimer = null;
    function stop(){ clearTimeout(holdDelay); clearInterval(holdTimer); holdDelay = holdTimer = null; }
    var btns = document.querySelectorAll(".step-btn");
    for (var i = 0; i < btns.length; i++) {
      (function(btn){
        var k = btn.getAttribute("data-k");
        var d = parseInt(btn.getAttribute("data-d"), 10);
        btn.addEventListener("pointerdown", function(e){
          e.preventDefault();
          stepTime(k, d);
          holdDelay = setTimeout(function(){ holdTimer = setInterval(function(){ stepTime(k, d); }, 90); }, 400);
        });
        btn.addEventListener("pointerup", stop);
        btn.addEventListener("pointerleave", stop);
        btn.addEventListener("pointercancel", stop);
      })(btns[i]);
    }
  })();

  function paint(s){
    var cap = parseInt(s.CAP, 10);
    if (isNaN(cap)) cap = 0;
    el("pct").textContent = cap;
    var offset = CIRC - (CIRC * Math.min(Math.max(cap, 0), 100) / 100);
    var bar = el("bar");
    bar.style.strokeDashoffset = offset;

    var enabled = s.ENABLED === "1";
    var effEnabled = s.EFF_ENABLED === "1";
    var bypass  = String(s.NODE_VAL) === "1";
    var alive   = s.DAEMON_ALIVE === "1";
    var supported = s.SUPPORTED === "1";

    var ver = String(s.VERSION || "");
    if (ver && ver !== lastVer) {
      lastVer = ver;
      el("verTx").textContent = ver;
    }

    var mode = s.MODE || "compat";
    if (mode !== lastMode) {
      lastMode = mode;
      var floor = (mode === "precise") ? 1 : 80;
      el("t1").min = floor;
      el("t2").min = 1;
      if (parseInt(el("t1").value, 10) < floor) el("t1").value = floor;
      el("hint").innerHTML = (mode === "precise")
        ? '恢复阈值需低于停止阈值，至少相差 5%；否则会在同一电量反复开关。<br>本机型支持 <b>精确模式</b>，停止阈值可设 1–100%。'
        : '恢复阈值需低于停止阈值，至少相差 5%；否则会在同一电量反复开关。<br>本机型只能走厂商夜间充电（<b>兼容模式</b>），停止阈值最低 <b>80%</b>。';
      var mb = el("modeBadge");
      mb.textContent = (mode === "precise") ? "精确模式 · 可设 1-100%" : "兼容模式 · 可设 80-100%";
      mb.style.display = "";
    }

    // 主状态文案
    var st, sub, color;
    var cst = String(s.CHARGE_STATUS || "").toLowerCase();
    var cur = parseInt(s.CURRENT, 10);
    if (!supported) {
      st = "机型不支持"; sub = "未找到夜间充电控制节点"; color = "var(--red)";
    } else if (!enabled) {
      st = "模块已停用"; sub = "当前按系统默认方式充电"; color = "#8d95a3";
    } else if (!effEnabled) {
      st = "定时暂停中"; sub = "当前不在定时窗口内，恢复正常充电"; color = "#8d95a3";
    } else if (bypass) {
      st = "旁路供电中"; sub = "已停止充电，设备由适配器直接供电"; color = "var(--acc)";
    } else if (cst === "discharging") {
      st = "未充电"; sub = "未连接充电器，电池放电中"; color = "#8d95a3";
    } else if (cst === "full") {
      st = "已充满"; sub = "电池已充满，设备由适配器供电"; color = "var(--acc)";
    } else if (cst === "not charging" || cst === "notcharging") {
      st = "旁路供电中"; sub = "已停止充电，设备由适配器直接供电"; color = "var(--acc)";
    } else if (cst === "charging") {
      if (!isNaN(cur) && cur >= -20000 && cur <= 20000) {
        st = "旁路供电中"; sub = "已停止充电，设备由适配器直接供电"; color = "var(--acc)";
      } else {
        st = "正在充电"; sub = "电量未达停止阈值，正常充电中"; color = "var(--blue)";
      }
    } else {
      st = "正在充电"; sub = "电量未达停止阈值，正常充电中"; color = "var(--blue)";
    }
    el("stateTx").textContent = st;
    el("stateTx").style.color = color;
    el("stateSub").textContent = sub;
    bar.style.stroke = color;

    // 电流 / 温度
    var i = parseInt(s.CURRENT, 10);
    if (!isNaN(i)) {
      el("mI").textContent = (i / 1000).toFixed(0) + " mA";
      el("mI").style.color = i < 0 ? "var(--blue)" : "var(--tx)";
    } else { el("mI").textContent = "—"; }
    var t = parseInt(s.TEMP, 10);
    el("mT").textContent = isNaN(t) ? "—" : (t / 10).toFixed(1) + " °C";

    // 徽章
    var bd = el("badge");
    bd.className = "badge " + (!supported ? "err" : (bypass && effEnabled ? "on" : "off"));
    bd.textContent = !supported ? "不支持" : (bypass && effEnabled ? "旁路中" : (effEnabled ? "已启用" : "已停用"));

    // 开关
    el("swEnable").checked = enabled;
    el("swEnable").disabled = !supported || busy;

    // 阈值滑块
    if (!dirty.t1) { el("t1").value = s.ENABLE_THRESHOLD; el("v1").textContent = s.ENABLE_THRESHOLD + "%"; }
    if (!dirty.t2) { el("t2").value = s.DISABLE_THRESHOLD; el("v2").textContent = s.DISABLE_THRESHOLD + "%"; }
    if (!dirty.t3) { el("t3").value = s.CHECK_INTERVAL; el("v3").textContent = s.CHECK_INTERVAL + " 秒"; }

    // 定时旁路（依赖主开关：主开关关时禁用）
    var schedOn = s.SCHEDULE_ENABLED === "1";
    el("swSched").checked = schedOn;
    el("swSched").disabled = busy || !enabled;
    el("schedStartBox").classList.toggle("off", !schedOn || !enabled || busy);
    el("schedEndBox").classList.toggle("off", !schedOn || !enabled || busy);
    if (!dirty.sched) {
      var stt = parseHHMM(s.SCHEDULE_START || "23:00");
      var enn = parseHHMM(s.SCHEDULE_END || "07:00");
      sched.startH = stt.h; sched.startM = stt.m;
      sched.endH = enn.h; sched.endM = enn.m;
      renderSched();
    }
    if (!enabled) {
      el("schedHint").textContent = "请先开启上方「启用旁路供电」";
    } else if (schedOn) {
      el("schedHint").textContent = (s.SCHEDULE_ACTIVE === "1")
        ? "当前在定时内，旁路生效"
        : "当前在定时外，恢复正常充电";
    } else {
      el("schedHint").textContent = "定时关闭，全天启用旁路";
    }

    // 底栏
    el("nodePath").textContent = s.NODE || "";
    el("daemonLine").textContent = alive ? ("守护进程运行中 · PID " + s.DAEMON_PID) : "守护进程未运行";
    el("daemonCard").style.display = alive ? "none" : "block";

    state = s;
  }

  var reqSeq = 0;
  function refresh(){
    if (busy) return;
    var tok = ++reqSeq;
    run("/system/bin/sh " + SH + " status")
      .then(function(txt){
        if (busy || tok !== reqSeq) return;
        var s = parseKV(txt);
        if (s.SUPPORTED === undefined) {
          throw new Error("状态数据不完整，原始输出：" + String(txt || "(空)").slice(0, 240));
        }
        el("errbox").style.display = "none";
        paint(s);
      })
      .catch(function(e){
        el("badge").className = "badge err";
        el("badge").textContent = "连接失败";
        el("stateTx").textContent = "读取失败";
        el("stateTx").style.color = "var(--red)";
        el("stateSub").textContent = "无法与底层通信";
        var b = el("errbox");
        b.textContent = e.message;
        b.style.display = "block";
        paintBridge();
      });
  }

  function refreshLog(){
    run("/system/bin/sh " + SH + " log")
      .then(function(txt){
        var t = String(txt || "").replace(/^\s*LOG=/, "");
        t = t.replace(/\\n/g, "\n").trim();
        el("log").textContent = t || "(暂无日志)";
      })
      .catch(function(){ el("log").textContent = "(读取失败)"; });
  }

  /* ---------------- 操作 ---------------- */
  function setKey(k, v){
    return run("/system/bin/sh " + SH + " set " + k + " " + v).then(function(out){
      var t = String(out || "").trim();
      if (t.indexOf("OK=") !== 0) throw new Error(t || "设置未生效");
      return t;
    });
  }

  var opTimer = null;
  function opMsg(text, ok){
    var n = el("opMsg");
    if (opTimer) { clearTimeout(opTimer); opTimer = null; }
    if (!text) { n.className = "opmsg"; n.textContent = ""; return; }
    n.className = "opmsg " + (ok ? "ok" : "bad");
    n.textContent = text;
    opTimer = setTimeout(function(){ n.className = "opmsg"; n.textContent = ""; }, 5000);
  }

  function withBusy(fn){
    if (busy) return;
    busy = true;
    opMsg("");
    el("swEnable").disabled = true;
    el("swSched").disabled = true;
    Promise.resolve()
      .then(fn)
      .catch(function(e){ opMsg("操作失败：" + e.message, false); })
      .then(function(){
        busy = false;
        setTimeout(function(){ refresh(); refreshLog(); }, 700);
      });
  }

  /* ---------------- 事件绑定 ---------------- */
  el("swEnable").addEventListener("change", function(){
    var on = this.checked;
    withBusy(function(){
      return setKey("ENABLED", on ? "1" : "0").then(function(){
        opMsg(on ? "已启用旁路供电" : "已停用，恢复充电", true);
        return waitUntil(function(s){ return (s.ENABLED === "1") === on; });
      });
    });
  });

  function bindSlider(id, labelId, fmt){
    var s = el(id);
    s.addEventListener("input", function(){
      dirty[id] = true;
      el(labelId).textContent = fmt(this.value);
    });
  }
  bindSlider("t1", "v1", function(v){ return v + "%"; });
  bindSlider("t2", "v2", function(v){ return v + "%"; });
  bindSlider("t3", "v3", function(v){ return v + " 秒"; });

  el("btnSave").addEventListener("click", function(){
    var t1 = parseInt(el("t1").value, 10);
    var t2 = parseInt(el("t2").value, 10);
    var t3 = parseInt(el("t3").value, 10);
    if (t2 >= t1) { opMsg("未保存：恢复阈值必须低于停止阈值（当前 停止 " + t1 + "% / 恢复 " + t2 + "%）", false); return; }
    if (t1 - t2 < 5) { opMsg("未保存：两个阈值至少相差 5%（当前相差 " + (t1 - t2) + "%）", false); return; }
    withBusy(function(){
      return setKey("ENABLE_THRESHOLD", t1)
        .then(function(){ return setKey("DISABLE_THRESHOLD", t2); })
        .then(function(){ return setKey("CHECK_INTERVAL", t3); })
        .then(function(){ return run("/system/bin/sh " + SH + " status"); })
        .then(function(txt){
          var s = parseKV(txt);
          dirty.t1 = dirty.t2 = dirty.t3 = false;
          paint(s);
          opMsg("已保存并回读确认：停止 " + s.ENABLE_THRESHOLD + "% / 恢复 " + s.DISABLE_THRESHOLD + "% / 间隔 " + s.CHECK_INTERVAL + " 秒", true);
        });
    });
  });

  el("swSched").addEventListener("change", function(){
    var on = this.checked;
    withBusy(function(){
      return setKey("SCHEDULE_ENABLED", on ? "1" : "0").then(function(){
        opMsg(on ? "已开启定时旁路" : "已关闭定时，全天启用旁路", true);
      });
    });
  });

  el("btnSchedSave").addEventListener("click", function(){
    var st = pad2(sched.startH) + ":" + pad2(sched.startM);
    var en = pad2(sched.endH) + ":" + pad2(sched.endM);
    withBusy(function(){
      return setKey("SCHEDULE_START", st)
        .then(function(){ return setKey("SCHEDULE_END", en); })
        .then(function(){ return run("/system/bin/sh " + SH + " status"); })
        .then(function(txt){
          var s = parseKV(txt);
          dirty.sched = false;
          paint(s);
          opMsg("已保存定时：" + st + " ~ " + en, true);
        });
    });
  });

  // 日志折叠
  var logOpen = false;
  el("logHead").addEventListener("click", function(){
    logOpen = !logOpen;
    el("log").hidden = !logOpen;
    el("logArrow").textContent = logOpen ? "▾" : "▸";
    if (logOpen) refreshLog();
  });

  el("btnStart").addEventListener("click", function(){
    withBusy(function(){
      return run("/system/bin/sh " + SH + " start").then(function(){ toast("已启动守护进程"); });
    });
  });

  function waitUntil(pred){
    return new Promise(function(resolve){
      var tries = 0;
      var t = setInterval(function(){
        tries++;
        run("/system/bin/sh " + SH + " status").then(function(txt){
          var s = parseKV(txt);
          paint(s);
          if (pred(s) || tries >= 8) { clearInterval(t); resolve(); }
        }).catch(function(){ if (tries >= 8) { clearInterval(t); resolve(); } });
      }, 2500);
    });
  }

  /* ---------------- 启动 ---------------- */
  if (!hasKsu()) {
    el("errbox").style.display = "block";
    el("errbox").textContent = "未检测到 KernelSU WebUI 接口。请用 KsuWebUI 打开本页面，直接在浏览器中访问无法控制系统。";
  }

  // 打开页面时唤醒守护进程立刻裁决一次（平时空闲它会长睡省电）。
  // status 本身即时读 sysfs，先刷一次保证首屏有数；wake 后再刷一次拿裁决后的状态。
  function wakeDaemon(){
    run("/system/bin/sh " + SH + " wake")
      .then(function(){ setTimeout(refresh, 700); })
      .catch(function(){});
  }

  refresh();
  wakeDaemon();
  timer = setInterval(function(){ refresh(); }, 3000);
  setInterval(function(){ if (logOpen) refreshLog(); }, 12000);

  document.addEventListener("visibilitychange", function(){
    if (document.hidden) {
      clearInterval(timer); timer = null;
    } else if (!timer) {
      refresh();
      wakeDaemon();
      if (logOpen) refreshLog();
      timer = setInterval(function(){ refresh(); }, 3000);
    }
  });
})();
</script>
</body>
</html>
